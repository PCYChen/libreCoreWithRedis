spring.application.name=librecore

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/myjdbc?serverTimezone=Asia/Taipei&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=root

spring.jackson.time-zone=GMT-4
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Redis 連線設定
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=你的密碼 (若有設定)

# 指定快取類型為 Redis
spring.cache.type=redis
# 設定 Redis 快取過期時間（可選，例如 600 秒 = 10 分鐘）
spring.cache.redis.time-to-live=600000
